name: Release

# ============================================================================
#  release-please, augmented. Wraps googleapis/release-please
#  and adds what it can't do: a rich Release body and metadata.
#
#    push to main ──────────────► release-please job (opens/updates the
#                                 Release PR; merging it creates tag+Release)
#    tag push / manual dispatch ► release job: create Release if missing →
#                                 title + prerelease/draft flags →
#                                 [release-notes] → Contributors section
#
#  What it deliberately does NOT do: compile anything or attach binaries.
#  That is CI, and every project differs (0/2/3 artifacts, matrix builds).
#  Pair this with build.yml (same repo) in a second job when the project
#  produces binaries — see the README.
#
#  ── Minimal caller — THE ONLY file a project needs ─────────────────────────
#    on:
#      push:
#        branches: [main]        # release-please accumulates conventional commits
#        tags: ["v*.*.*"]        # augment the Release on tag
#      workflow_dispatch:
#        inputs: { version: { required: false } }   # manual release (skips rp)
#    permissions:
#      contents: write           # tag + Release edit
#      pull-requests: write      # release-please opens the Release PR
#    jobs:
#      release:
#        uses: JoShMiQueL/gh-actions/.github/workflows/release.yml@main
#        secrets:
#          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}   # PAT — bot tags must re-trigger
#        with:
#          release-title: "MyApp {version}"
#
#  ── Secrets ────────────────────────────────────────────────────────────────
#    token   PAT — release-please pushes tags + `gh release edit`. A bot-pushed
#             tag only re-triggers this workflow if a PAT pushed it
#             (GITHUB_TOKEN doesn't cascade). Falls back to github.token —
#             enough when tags come from manual `git tag`.
#
#  ── Inputs ─────────────────────────────────────────────────────────────────
#    trigger   version, tag-prefix, runner
#    release   release-title, release-notes, contributors, prerelease, draft
#    rp        release-please, rp-config-file, rp-manifest-file
# ============================================================================

on:
  workflow_call:
    inputs:
      # ── trigger / resolve ────────────────────────────────────────────────
      version:
        description: "Manual-dispatch version — skips release-please entirely and releases this version directly. Ignored on tag/branch push."
        required: false
        default: ""
        type: string
      tag-prefix:
        description: "Tag prefix stripped to get the version — 'v'→v0.1.4→0.1.4, ''→0.1.4→0.1.4, 'pkg-v'→pkg-v0.1.4→0.1.4."
        required: false
        default: "v"
        type: string
      runner:
        description: "Runner OS label for the metadata job — a pinned ubuntu is plenty (no compilation happens here)."
        required: false
        default: ubuntu-24.04
        type: string
      # ── release body / metadata ──────────────────────────────────────────
      release-title:
        description: "Release title template — '{version}' and '{tag}' expand (e.g. 'MyApp {version}', '{tag} — stable'). Empty keeps release-please's title (or 'v{version}' on manual creates)."
        required: false
        default: ""
        type: string
      release-notes:
        description: "Extra markdown appended to the Release body — after the changelog, before Contributors. For a fully custom body, edit it yourself afterwards (`gh release edit`)."
        required: false
        default: ""
        type: string
      contributors:
        description: "Append `### Contributors` to the Release body — authors of prev_tag..tag, first-timers flagged `*(new contributor)*`."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the Release a pre-release. Auto: any '-' in the version (v0.2.0-beta, -rc.1) is always treated as pre-release."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create/update the Release as a draft."
        required: false
        default: false
        type: boolean
      # ── release-please ───────────────────────────────────────────────────
      release-please:
        description: "Run the embedded release-please job on branch pushes (opens/updates the Release PR). Set false if you drive release-please from your own workflow."
        required: false
        default: true
        type: boolean
      rp-config-file:
        description: "release-please config path."
        required: false
        default: release-please-config.json
        type: string
      rp-manifest-file:
        description: "release-please manifest path."
        required: false
        default: .release-please-manifest.json
        type: string
    secrets:
      token:
        description: "PAT — release-please pushes tags + `gh release edit`. Falls back to github.token."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: branch push → release-please maintains the Release PR ──────────
  please:
    name: release-please
    if: ${{ inputs.release-please && github.ref_type == 'branch' && inputs.version == '' }}
    # pinned image — `-latest` labels migrate under us (Ubuntu 26 warning).
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: ${{ inputs.rp-config-file }}
          manifest-file: ${{ inputs.rp-manifest-file }}
          token: ${{ secrets.token || github.token }}

  # ── Job 2: tag push / manual dispatch → Release body + metadata ──────────
  release:
    name: release
    if: ${{ github.ref_type == 'tag' || inputs.version != '' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Contributors needs full history to flag first-timers

      # tag → version. v0.1.4→0.1.4, pkg-v0.1.4→0.1.4 (prefix "pkg-v"),
      # 0.1.4→0.1.4 (prefix ""). Manual dispatch synthesizes tag = prefix+ver.
      - name: Resolve tag + version
        id: ver
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            v="$tag"
            if [ -n "$TAG_PREFIX" ] && [[ "$tag" == "$TAG_PREFIX"* ]]; then
              v="${tag#$TAG_PREFIX}"
            fi
          else
            v="$INPUT_VERSION"
            tag="${TAG_PREFIX}${v}"
          fi
          [ -z "$v" ] && { echo "::error::no version resolved — pass 'version' on dispatch or push a tag"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          { echo "VERSION=$v"; echo "TAG=$tag"; } >> "$GITHUB_ENV"
          echo "Releasing v$v (tag $tag)"

      # release-please normally already created the Release — this job then
      # only edits title/flags/body. Manual runs (or a race with a sibling
      # build job): create it if missing. `gh release create` on an existing
      # release fails — retry the view, that's the race winner having landed.
      - name: Ensure Release + title + flags
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ inputs.release-title }}
          PRERELEASE_IN: ${{ inputs.prerelease }}
          DRAFT_IN: ${{ inputs.draft }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          is_pre=false
          [ "$PRERELEASE_IN" = "true" ] && is_pre=true
          [[ "$VER" == *-* ]] && is_pre=true
          flags=()
          $is_pre && flags+=(--prerelease)
          [ "$DRAFT_IN" = "true" ] && flags+=(--draft)

          title="${RELEASE_TITLE//\{version\}/$VER}"
          title="${title//\{tag\}/$TAG}"
          [ -z "$title" ] && title="v$VER"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "no existing release for $TAG — creating one (plain notes)"
            gh release create "$TAG" --repo "$REPO" --title "$title" --notes "Release $VER" "${flags[@]}" || true
            # A concurrent job may have won the create — either way it must exist now.
            for i in 1 2 3 4 5; do
              gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && break
              sleep 3
            done
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
              || { echo "::error::release $TAG still missing after create"; exit 1; }
          fi

          # Apply flags + a caller-supplied title onto an existing release too.
          if $is_pre || [ "$DRAFT_IN" = "true" ]; then
            gh release edit "$TAG" --repo "$REPO" "${flags[@]}" || true
          fi
          [ -n "$RELEASE_TITLE" ] && gh release edit "$TAG" --repo "$REPO" --title "$title"
          exit 0

      - name: Append release notes
        if: ${{ inputs.release-notes != '' }}
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ inputs.release-notes }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > /tmp/body.md
          # Idempotency: match the first non-empty line of NOTES — a blank-line-
          # containing $NOTES makes `grep -F` match everything and skip wrongly.
          first_line="$(echo "$NOTES" | grep -m1 . || true)"
          if [ -n "$first_line" ] && grep -qF "$first_line" /tmp/body.md; then
            echo "release-notes already present in body — skipping (idempotent re-run)"
          else
            printf '\n\n%s\n' "$NOTES" >> /tmp/body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body.md
            echo "appended release-notes to $TAG"
          fi

      # Contributors live in the Release body (the page), never CHANGELOG.md.
      # Range = prev_tag..this_tag; an author is "(new contributor)" if they
      # never committed before the previous tag. Reads `git log %an`.
      - name: Append Contributors section
        if: ${{ inputs.contributors }}
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          echo "contributor range: $range (prev: ${prev:-none})"

          # Resolve each author to their GitHub login via commit email so the
          # section links (@[login](…)) instead of a bare display name. Email
          # → login goes through the search API; on any miss we keep the name.
          mapfile -t lines < <(git log "$range" --format='%an|%ae' 2>/dev/null | sort -u | grep -v '^$')
          [ ${#lines[@]} -eq 0 ] && { echo "no authors in range"; exit 0; }

          prior=""
          [ -n "$prev" ] && prior="$(git log "$prev" --format='%an' | sort -u)"

          section=""
          for line in "${lines[@]}"; do
            a="${line%%|*}"; email="${line##*|}"
            login=""
            if [[ "$email" =~ ^[0-9]+\+([^@]+)@users\.noreply\.github\.com$ ]]; then
              login="${BASH_REMATCH[1]}"                       # noreply embeds the login
            elif [[ "$email" =~ ^([^@]+)@users\.noreply\.github\.com$ ]]; then
              login="${BASH_REMATCH[1]}"
            else
              login="$(gh api "search/users?q=$email+in:email" --jq '.items[0].login' 2>/dev/null || true)"
            fi
            badge=""
            if [ -n "$prev" ] && ! grep -qxF "$a" <<< "$prior"; then
              badge=" *(new contributor)*"
            fi
            if [ -n "$login" ]; then
              # bare @login → GitHub renders the avatar + hovercard (a real
              # mention), not just a styled link. []() would look the same
              # but lose the mention.
              section+="- @$login$badge"$'\n'
            else
              section+="- $a$badge"$'\n'
            fi
          done

          gh release view "$TAG" --repo "$REPO" --json body --jq .body > /tmp/body.md
          if grep -q '### Contributors' /tmp/body.md; then
            echo "release body already has a Contributors section — skipping (idempotent re-run)"
          else
            printf '\n\n### Contributors\n\n%s' "$section" >> /tmp/body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body.md
            echo "appended Contributors to $TAG"
          fi
