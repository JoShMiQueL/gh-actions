name: Release

# ============================================================================
#  One reusable "tag → release" pipeline for every project. A tag (from
#  release-please merging its Release PR, or a manual `git tag vX.Y.Z`) runs:
#
#      checkout → load env-JSON → resolve version → toolchain presets →
#      [frontend build] → [version stamp] → build → attach binaries →
#      append "### Contributors" to the Release body → [post-publish hook]
#
#  The CHANGELOG.md in the repo stays clean — release-please owns it and it
#  holds ONLY categorized changes (Features/Fixes). Contributors live in the
#  Release body (the GitHub page), never in the file — the clap model.
#
#  ── Minimal caller (any project) ──────────────────────────────────────────
#    on:
#      push: { tags: ["v*.*.*"] }
#      workflow_dispatch: { inputs: { version: { required: true } } }
#    permissions: { contents: write }
#    jobs:
#      release:
#        uses: JoShMiQueL/gh-actions/.github/workflows/release.yml@main
#        secrets:
#          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}   # for `gh release edit`
#          env-json:   ${{ secrets.PROJECT_RELEASE_ENV }}    # JSON {"KEY":"val",...}
#                                                         # (renamed — bare 'env' is a reserved name)
#        with:
#          toolchain: go
#          build-command: go build -o dist/app.exe ./cmd/app
#          artifacts: dist/app.exe
#
#  ── Hooks (all optional, all pwsh, all see $env:VERSION + $env:TAG) ────────
#    setup-command        runs pre-build — e.g. stamp $env:VERSION into
#                         Cargo.toml / package.json, codegen, pip install.
#    post-publish-command runs after attach — e.g. publish a self-update
#                         pointer to R2/S3, bump a "latest" file, notify.
#
#  ── Secrets ───────────────────────────────────────────────────────────────
#    token    PAT used for `gh release edit` (contributors body). Falls back to
#             github.token when unset — enough for same-repo edits.
#    env-json One JSON object carrying the project's whole env — keeps secrets
#             out of the caller YAML. `{"API_KEY":"y","BUCKET":"x"}` is injected
#             into every step via `Load project env`. Named `env-json` because
#             bare `env` is a reserved secret name in workflow_call.
#
#  ── Per-input reference ───────────────────────────────────────────────────
#    version           manual-dispatch version (ignored on tag push)
#    tag-prefix        strip this from the tag → version ("v" default; "" for
#                      bare `0.1.4`; "pkg-v" for monorepo `pkg-v0.1.4`)
#    runner            windows-latest | ubuntu-latest | macos-latest
#    toolchain         space-separated builtins → their setup action: rust
#                      (toolchain+cache) | node | go | dotnet (C#/F#) | python |
#                      bun — or `custom` (none; drive it via setup-command or an
#                      earlier `uses:` in your workflow — C++ MSVC, zig, java…)
#    node_version      node for the frontend step (default 24)
#    node_workdir      dir with package.json → `npm ci|install` + `npm run build`
#                      (npm install when no lockfile); empty skips the frontend
#    artifacts         newline/space-separated paths or globs attached to the
#                      Release — shippable binaries only; fails if any missing
#    contributors      bool — append the Contributors section (default true)
#    prerelease        bool — mark the Release pre-release; AUTO on `-` in the
#                      version (v0.2.0-beta, -rc.1) regardless of this input
#    draft             bool — create the Release as a draft
# ============================================================================

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (manual dispatch only; ignored on tag push)."
        required: false
        type: string
      tag-prefix:
        description: "Tag prefix stripped to get the version — 'v'→v0.1.4→0.1.4, ''→0.1.4→0.1.4, 'pkg-v'→pkg-v0.1.4→0.1.4."
        required: false
        default: "v"
        type: string
      runner:
        description: "Runner OS label."
        required: false
        default: windows-latest
        type: string
      toolchain:
        description: >-
          Build toolchain(s) to provision — space/comma/newline-separated
          tokens, or "custom" (none — drive it via setup-command). Built-in
          presets (each maps to its standard setup action):
            rust    → dtolnay/rust-toolchain + Swatinem/rust-cache
            node    → actions/setup-node
            go      → actions/setup-go
            dotnet  → actions/setup-dotnet  (C# / F#)
            python  → actions/setup-python
            bun     → oven-sh/setup-bun
          Multiple: "go node", "rust dotnet". For anything else (C/C++ MSVC,
          zig, java, flutter, deno…) use `custom` + `setup-command` to run the
          stack's own installer, OR put a `uses: owner/setup-*` step in your
          own workflow before this reusable call (cleanest for exotic stacks —
          the reusable never had to know about them).
        required: false
        default: custom
        type: string
      node_version:
        description: "Node version for the frontend/npm step."
        required: false
        default: "24"
        type: string
      node_workdir:
        description: "Dir with package.json — `npm ci` (or `npm install` when no lockfile) + `npm run build` run here; empty skips the frontend."
        required: false
        default: ""
        type: string
      setup-command:
        description: "pwsh run before build (version stamp, codegen, deps). $env:VERSION + $env:TAG set."
        required: false
        default: ""
        type: string
      build-command:
        description: "pwsh build command — the release build."
        required: true
        type: string
      artifacts:
        description: "Newline/space-separated file paths or globs attached to the Release — shippable binaries only."
        required: true
        type: string
      contributors:
        description: "Append `### Contributors` (range authors, first-timers flagged) to the Release body."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Force-mark the Release as a pre-release. Auto: a tag/version containing '-' (v0.2.0-beta, -rc.1) is always treated as pre-release regardless."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the Release as a draft (manual review before publishing). release-please draft releases are edited in place."
        required: false
        default: false
        type: boolean
      post-publish-command:
        description: "pwsh run after attach (publish pointer, notify). $env:VERSION/$env:TAG set; env-JSON loaded."
        required: false
        default: ""
        type: string
    secrets:
      token:
        description: "PAT for `gh release edit` — falls back to github.token if unset."
        required: false
      env-json:
        description: "JSON object of env vars injected into every step — keeps per-project secrets out of the caller YAML."
        required: false

permissions:
  contents: write

jobs:
  release:
    name: resolve → build → attach → contributors → post-publish
    runs-on: ${{ inputs.runner }}
    env:
      # secrets can't sit in `if:` conditions — map the env-JSON here so steps
      # can test `env.PROJ_ENV != ''` instead.
      PROJ_ENV: ${{ secrets.env-json }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # contributors needs full history to flag first-timers

      - name: Load project env
        if: ${{ env.PROJ_ENV != '' }}
        shell: pwsh
        run: |
          ($env:PROJ_ENV | ConvertFrom-Json).PSObject.Properties | ForEach-Object {
            "$($_.Name)=$($_.Value)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      # tag → version. `v0.1.4`→0.1.4, `pkg-v0.1.4`→0.1.4 (prefix "pkg-v"),
      # `0.1.4`→0.1.4 (prefix ""). Manual dispatch synthesizes tag = prefix+ver.
      - name: Resolve tag + version
        id: ver
        shell: pwsh
        run: |
          $prefix = "${{ inputs.tag-prefix }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $v = $tag
            if ($prefix -and $tag.StartsWith($prefix)) { $v = $tag.Substring($prefix.Length) }
          } else {
            $v = "${{ inputs.version }}"
            $tag = "$prefix$v"
          }
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag"     | Out-File $env:GITHUB_OUTPUT -Append
          "VERSION=$v"   | Out-File $env:GITHUB_ENV -Append
          "TAG=$tag"     | Out-File $env:GITHUB_ENV -Append
          Write-Output "Releasing v$v (tag $tag)"

      # ── Toolchain — built-in presets only ─────────────────────────────────
      # `toolchain` may hold several tokens: "rust", "go node", "rust dotnet".
      # Built-ins expand to their standard setup action. Anything else (C++
      # MSVC, zig, java, flutter…) = `custom` + the caller provisions it via
      # setup-command or an earlier `uses:` in its own workflow.
      - name: Setup Rust
        if: ${{ contains(inputs.toolchain, 'rust') }}
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: ${{ contains(inputs.toolchain, 'rust') }}
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        if: ${{ contains(inputs.toolchain, 'go') }}
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Setup Python
        if: ${{ contains(inputs.toolchain, 'python') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup .NET (C#/F#)
        if: ${{ contains(inputs.toolchain, 'dotnet') }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.x"

      - name: Setup Bun
        if: ${{ contains(inputs.toolchain, 'bun') }}
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        if: ${{ contains(inputs.toolchain, 'node') || inputs.node_workdir != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}

      # Non-builtin toolchains: the caller handles them — either an earlier
      # `uses:` step in its own workflow (before this reusable job) or
      # `setup-command` runs the installer. The reusable never has to know.

      # npm ci needs package-lock.json; fall back to npm install when absent.
      - name: Build frontend (npm ci|install + build)
        if: ${{ inputs.node_workdir != '' }}
        working-directory: ${{ inputs.node_workdir }}
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          npm run build

      - name: Version stamp / pre-build
        if: ${{ inputs.setup-command != '' }}
        shell: pwsh
        run: |
          ${{ inputs.setup-command }}

      - name: Build
        shell: pwsh
        run: |
          ${{ inputs.build-command }}

      # release-please already created the Release with the changelog body —
      # attach binaries to it. Manual runs: create it if missing.
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $patterns = "${{ inputs.artifacts }}" -split "[`n ]" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          # `gh release upload` on Windows glob-expands the arg itself, so
          # `dir/file` or an absolute `D:\...` dies with "no matches found".
          # Resolve each pattern to files and pass just the BASENAME while
          # sitting in the file's directory — the only form gh can't glob-mangle.
          $toUpload = @()
          foreach ($p in $patterns) {
            $resolved = Get-Item $p -ErrorAction SilentlyContinue
            if (-not $resolved) { Write-Error "artifact not found: $p"; exit 1 }
            $toUpload += $resolved
          }
          $repo = "${{ github.repository }}"
          # Pre-release auto-detect: a '-' in the version (v0.2.0-beta, -rc.1)
          # OR the explicit `prerelease` input → mark the release pre-release.
          $isPre = "${{ inputs.prerelease }}" -eq "true" -or "${{ steps.ver.outputs.version }}" -match "-"
          $draftFlag = @(); if ("${{ inputs.draft }}" -eq "true") { $draftFlag += "--draft" }
          $preFlag   = @(); if ($isPre) { $preFlag += "--prerelease" }

          $exists = $false
          try { gh release view $tag --repo $repo | Out-Null; $exists = ($LASTEXITCODE -eq 0) } catch { $exists = $false }
          if (-not $exists) {
            Write-Output "no existing release for $tag — creating one (plain notes)"
            gh release create $tag --repo $repo --title "v${{ steps.ver.outputs.version }}" --notes "Release ${{ steps.ver.outputs.version }}" @preFlag @draftFlag
            if ($LASTEXITCODE -ne 0) { Write-Error "gh release create failed"; exit $LASTEXITCODE }
            Start-Sleep -Seconds 3   # let the API settle before upload
          } elseif ($isPre -or $draftFlag) {
            # release-please may have created the release already — re-flag it
            # so a beta tag isn't shipped as a "Latest" stable release.
            gh release edit $tag --repo $repo @preFlag @draftFlag
          }
          foreach ($f in $toUpload) {
            Push-Location $f.Directory.FullName
            gh release upload $tag $f.Name --clobber --repo $repo
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { Write-Error "gh release upload failed for $($f.Name)"; exit $code }
          }

      # Contributors live in the Release body (the page), never in CHANGELOG.md.
      # Range = prev_tag..this_tag; an author is "(new contributor)" if they
      # never committed before the previous tag. Reads `git log %an` — works on
      # direct commits, no PRs needed.
      - name: Append Contributors section to Release body
        if: ${{ inputs.contributors }}
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          Write-Output "contributor range: $range (prev: $($prev -or 'none'))"

          $rangeAuthors = git log $range --format='%an' 2>$null | Where-Object { $_ } | Sort-Object -Unique
          if (-not $rangeAuthors) { Write-Output "no authors in range"; exit 0 }

          $priorAuthors = @()
          if ($prev) { $priorAuthors = git log "$prev" --format='%an' 2>$null | Sort-Object -Unique }

          $section = "`n`n### Contributors`n`n"
          foreach ($a in $rangeAuthors) {
            $isNew = $prev -and ($priorAuthors -notcontains $a)
            $badge = if ($isNew) { " *(new contributor)*" } else { "" }
            $section += "- $a$badge`n"
          }
          $section = $section.TrimEnd()

          $bodyFile = New-TemporaryFile
          gh release view $tag --repo ${{ github.repository }} --json body --jq .body | Out-File $bodyFile -Encoding utf8
          Add-Content $bodyFile "`n$section`n"
          gh release edit $tag --repo ${{ github.repository }} --notes-file $bodyFile
          Remove-Item $bodyFile -ErrorAction SilentlyContinue
          Write-Output "appended Contributors to $tag"

      - name: Post-publish
        if: ${{ inputs.post-publish-command != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
        run: |
          ${{ inputs.post-publish-command }}
