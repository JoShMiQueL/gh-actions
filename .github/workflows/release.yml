name: Release

# ============================================================================
#  One reusable release pipeline for every project. A caller listens on both
#  main pushes and tags — this workflow runs ONE of its two jobs:
#
#    push to main ──────────────► release-please job (opens/updates the
#                                 Release PR; merging it creates tag+Release)
#    tag push / manual dispatch ► release job: checkout → env → toolchain →
#                                 [frontend] → [version stamp] → build →
#                                 attach → [release-notes] → Contributors →
#                                 [post-publish]
#
#  ── Minimal caller — THE ONLY file a project needs ─────────────────────────
#    on:
#      push:
#        branches: [main]        # release-please accumulates conventional commits
#        tags: ["v*.*.*"]        # build+publish on tag
#      workflow_dispatch:
#        inputs: { version: { required: false } }   # manual release (skips rp)
#    permissions:
#      contents: write           # tag + Release + upload
#      pull-requests: write      # release-please opens the Release PR
#    jobs:
#      release:
#        uses: JoShMiQueL/gh-actions/.github/workflows/release.yml@main
#        secrets:
#          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}   # PAT — bot tags must re-trigger
#          env-json: ${{ secrets.PROJECT_RELEASE_ENV }} # JSON {"KEY":"val",...} (optional)
#        with:
#          toolchain: go          # or "rust node@24", "python@3.12", …
#          build-command: go build -o dist/app ./cmd/app
#          artifacts: dist/app
#
#  ── Secrets ────────────────────────────────────────────────────────────────
#    token    PAT — release-please + `gh release edit`. A bot-pushed tag only
#             re-triggers this workflow if a PAT pushed it (GITHUB_TOKEN
#             doesn't cascade). Falls back to github.token — enough when tags
#             come from manual `git tag`.
#    env-json One JSON object = the project's env, injected into every step
#             with each value `::add-mask::`ed first. Named env-json because
#             bare `env` is a reserved secret name in workflow_call.
#
#  ── Hooks — all optional, all run in `shell` (bash default), all see ────────
#     $VERSION + $TAG exported to GITHUB_ENV.
#     IMPORTANT: `with:` inputs evaluate BEFORE the reusable runs — GitHub's
#     `${{ env.VERSION }}` does NOT exist there. Use the SHELL variable inside
#     the hook body: `$VERSION` (bash) / `$env:VERSION` (pwsh).
#    setup-command        after version-stamp, before build — codegen, deps.
#    post-publish-command after attach — publish a self-update pointer, notify.
#
#  ── Inputs (grouped) ────────────────────────────────────────────────────────
#    trigger   version, tag-prefix, runner, shell
#    toolchain toolchain (name[@version] tokens), node_workdir
#    version   version-bump (auto|none), version-files
#    build     setup-command, build-command, artifacts
#    release   release-title, release-notes, contributors, prerelease, draft
#    hooks     post-publish-command
#    rp        release-please, rp-config-file, rp-manifest-file
# ============================================================================

on:
  workflow_call:
    inputs:
      # ── trigger / resolve ────────────────────────────────────────────────
      version:
        description: "Manual-dispatch version — skips release-please entirely and releases this version directly. Ignored on tag/branch push."
        required: false
        default: ""
        type: string
      tag-prefix:
        description: "Tag prefix stripped to get the version — 'v'→v0.1.4→0.1.4, ''→0.1.4→0.1.4, 'pkg-v'→pkg-v0.1.4→0.1.4."
        required: false
        default: "v"
        type: string
      runner:
        description: "Runner OS label — windows-latest | ubuntu-latest | macos-latest | any self-hosted label."
        required: false
        default: windows-latest
        type: string
      shell:
        description: "Shell the hook commands (setup/build/post-publish) run in — bash | pwsh | sh | cmd | python. Internal steps always use bash (Git Bash on Windows). Choose pwsh when your hooks need PowerShell syntax."
        required: false
        default: bash
        type: string
      # ── toolchain ────────────────────────────────────────────────────────
      toolchain:
        description: >-
          Toolchain(s) to provision — space/comma-separated `name[@version]`
          tokens, or "custom" (none — install via setup-command or an earlier
          `uses:` in your own workflow). Built-ins:
            rust    → dtolnay/rust-toolchain + Swatinem/rust-cache  (@stable)
            node    → actions/setup-node                            (@lts/*)
            go      → actions/setup-go                              (@stable)
            dotnet  → actions/setup-dotnet   (C# / F#)              (@8.x)
            python  → actions/setup-python                          (@3.x)
            bun     → oven-sh/setup-bun                             (@latest)
          Versions are inline: "rust@1.75.0 python@3.12 go@1.22". Omit @ to
          take the default shown. Multiple toolchains: "rust node@24".
          Anything else (C++ MSVC, zig, java, flutter, deno…) = `custom` +
          setup-command runs the installer, OR a `uses:` step before this
          reusable call — the reusable never has to know about them.
        required: false
        default: custom
        type: string
      node_workdir:
        description: "Dir with package.json — `npm ci` (or `npm install` when no lockfile) + `npm run build` run here, and its package.json gets version-stamped. Implies the node toolchain (version via `node@x` token, else lts/*). Empty skips the frontend."
        required: false
        default: ""
        type: string
      # ── version stamp ────────────────────────────────────────────────────
      version-bump:
        description: >-
          auto (default): stamp $VERSION into the canonical manifest of each
          active toolchain — root Cargo.toml (rust), package.json (node/bun,
          root + node_workdir), pyproject.toml (python). Replacement = first
          semver found in the file, so quotes/tags around it are preserved.
          none: skip stamping — set the version yourself in setup-command.
        required: false
        default: auto
        type: string
      version-files:
        description: "Extra files to stamp $VERSION into (one path per line) — tauri.conf.json, *.csproj, app.spec, custom manifests… Same rule: first semver in the file is replaced."
        required: false
        default: ""
        type: string
      # ── build ────────────────────────────────────────────────────────────
      setup-command:
        description: "Runs after version-stamp, before build — codegen, extra deps, patches. Shell = `shell` input; sees $VERSION + $TAG."
        required: false
        default: ""
        type: string
      build-command:
        description: "The release build. Shell = `shell` input; sees $VERSION + $TAG."
        required: true
        type: string
      artifacts:
        description: "Files/globs to attach to the Release, one per line — shippable binaries only. Missing files fail the run loudly."
        required: true
        type: string
      # ── release body ─────────────────────────────────────────────────────
      release-title:
        description: "Release title template — '{version}' and '{tag}' expand (e.g. 'MyApp {version}', '{tag} — stable'). Empty keeps release-please's title (or 'v{version}' on manual creates)."
        required: false
        default: ""
        type: string
      release-notes:
        description: "Extra markdown appended to the Release body — after the changelog, before Contributors. For a fully custom body use post-publish-command + `gh release edit`."
        required: false
        default: ""
        type: string
      contributors:
        description: "Append `### Contributors` to the Release body — authors of prev_tag..tag, first-timers flagged `*(new contributor)*`."
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Mark the Release a pre-release. Auto: any '-' in the version (v0.2.0-beta, -rc.1) is always treated as pre-release."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create/update the Release as a draft."
        required: false
        default: false
        type: boolean
      # ── hooks / release-please ───────────────────────────────────────────
      post-publish-command:
        description: "Runs after attach+contributors — publish a self-update pointer, bump a 'latest' file, notify. Shell = `shell` input; sees $VERSION + $TAG + env-json vars."
        required: false
        default: ""
        type: string
      release-please:
        description: "Run the embedded release-please job on branch pushes (opens/updates the Release PR). Set false if you drive release-please from your own workflow."
        required: false
        default: true
        type: boolean
      rp-config-file:
        description: "release-please config path."
        required: false
        default: release-please-config.json
        type: string
      rp-manifest-file:
        description: "release-please manifest path."
        required: false
        default: .release-please-manifest.json
        type: string
    secrets:
      token:
        description: "PAT — release-please pushes tags + `gh release edit`. Falls back to github.token."
        required: false
      env-json:
        description: "JSON object of env vars injected (masked) into every step — keeps per-project secrets out of the caller YAML."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: branch push → release-please maintains the Release PR ──────────
  please:
    name: release-please
    if: ${{ inputs.release-please && github.ref_type == 'branch' && inputs.version == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: ${{ inputs.rp-config-file }}
          manifest-file: ${{ inputs.rp-manifest-file }}
          token: ${{ secrets.token || github.token }}

  # ── Job 2: tag push / manual dispatch → build + attach + publish ─────────
  release:
    name: release
    if: ${{ github.ref_type == 'tag' || inputs.version != '' }}
    runs-on: ${{ inputs.runner }}
    env:
      # secrets can't sit in `if:` — map env-JSON here so steps can test
      # `env.PROJ_ENV != ''` instead.
      PROJ_ENV: ${{ secrets.env-json }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Contributors needs full history to flag first-timers

      - name: Load project env
        if: ${{ env.PROJ_ENV != '' }}
        shell: bash
        env:
          PROJ_ENV_RAW: ${{ secrets.env-json }}
        run: |
          # Validate before parsing — a malformed env-json fails with a clear
          # message instead of a bare `jq: parse error`.
          if ! echo "$PROJ_ENV_RAW" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "::error::env-json secret is not a JSON object — expected {\"KEY\":\"val\",...}"
            exit 1
          fi
          # Mask every value BEFORE injecting — env vars otherwise echo in the
          # per-step "env:" dump. add-mask makes GitHub scrub them from logs.
          echo "$PROJ_ENV_RAW" | jq -r '.[]' | while IFS= read -r v; do
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "$v"
          done
          # Multiline values need the KEY<<DELIM heredoc form, not KEY=value —
          # otherwise a value containing \n truncates. Non-string values
          # (numbers/bools) serialize fine via @json-free %s.
          echo "$PROJ_ENV_RAW" | jq -r 'to_entries[] | "\(.key)\u0000\(.value|tostring)\u0000"' |
          while IFS= read -r -d '' k && IFS= read -r -d '' v; do
            if [[ "$v" == *$'\n'* ]]; then
              { echo "$k<<S1L_EOF_$k"; echo "$v"; echo "S1L_EOF_$k"; } >> "$GITHUB_ENV"
            else
              echo "$k=$v" >> "$GITHUB_ENV"
            fi
          done

      # tag → version. v0.1.4→0.1.4, pkg-v0.1.4→0.1.4 (prefix "pkg-v"),
      # 0.1.4→0.1.4 (prefix ""). Manual dispatch synthesizes tag = prefix+ver.
      - name: Resolve tag + version
        id: ver
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            v="$tag"
            if [ -n "$TAG_PREFIX" ] && [[ "$tag" == "$TAG_PREFIX"* ]]; then
              v="${tag#$TAG_PREFIX}"
            fi
          else
            v="$INPUT_VERSION"
            tag="${TAG_PREFIX}${v}"
          fi
          [ -z "$v" ] && { echo "::error::no version resolved — pass 'version' on dispatch or push a tag"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          { echo "VERSION=$v"; echo "TAG=$tag"; } >> "$GITHUB_ENV"
          echo "Releasing v$v (tag $tag)"

      # Parse `toolchain` tokens `name[@ver]` → outputs `<name>-version` used by
      # the setup actions below. Missing @ver → the preset's default.
      - name: Parse toolchain
        id: tc
        shell: bash
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          declare -A def=( [rust]=stable [go]=stable [python]="3.x" [dotnet]="8.x" [bun]=latest [node]="lts/*" )
          builtins="rust go python dotnet bun node custom"
          for tok in $TOOLCHAIN; do
            name="${tok%%@*}"
            ver="${tok#*@}"; [ "$ver" = "$tok" ] && ver=""
            [ -z "$ver" ] && ver="${def[$name]:-latest}"
            if [[ " $builtins " != *" $name "* ]]; then
              echo "::warning::toolchain token '$name' is not a built-in preset — nothing will install it. Use 'custom' + setup-command for exotic stacks."
            fi
            echo "${name}-version=${ver}" >> "$GITHUB_OUTPUT"
          done

      # ── Toolchain presets (built-ins only — `custom` provisions itself) ──
      - name: Setup Rust
        if: ${{ contains(inputs.toolchain, 'rust') }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs['rust-version'] || 'stable' }}

      - name: Rust cache
        if: ${{ contains(inputs.toolchain, 'rust') }}
        uses: Swatinem/rust-cache@v2

      - name: Setup Go
        if: ${{ contains(inputs.toolchain, 'go') }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.tc.outputs['go-version'] || 'stable' }}

      - name: Setup Python
        if: ${{ contains(inputs.toolchain, 'python') }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ steps.tc.outputs['python-version'] || '3.x' }}

      - name: Setup .NET (C#/F#)
        if: ${{ contains(inputs.toolchain, 'dotnet') }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.tc.outputs['dotnet-version'] || '8.x' }}

      - name: Setup Bun
        if: ${{ contains(inputs.toolchain, 'bun') }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tc.outputs['bun-version'] || 'latest' }}

      - name: Setup Node
        if: ${{ contains(inputs.toolchain, 'node') || inputs.node_workdir != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.tc.outputs['node-version'] || 'lts/*' }}

      # npm ci needs package-lock.json; fall back to npm install when absent.
      - name: Build frontend
        if: ${{ inputs.node_workdir != '' }}
        working-directory: ${{ inputs.node_workdir }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      # Stamp $VERSION into the toolchain's canonical manifest (root only,
      # predictable) + any `version-files`. First semver in the file is
      # replaced — surrounding quotes/tags are preserved, so it works for
      # TOML/JSON/XML/INI alike. `none` or a stack we don't know → caller
      # handles it in setup-command.
      - name: Stamp version
        if: ${{ inputs.version-bump == 'auto' }}
        shell: bash
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          NODE_WORKDIR: ${{ inputs.node_workdir }}
          VERSION_FILES: ${{ inputs.version-files }}
        run: |
          stamp() {
            local f="$1"
            if [ -f "$f" ]; then
              sed -i -E "0,/[0-9]+\.[0-9]+\.[0-9]+/s//$VERSION/" "$f"
              echo "stamped $f → $VERSION"
            else
              echo "::warning::version-file not found, skipped: $f"
            fi
          }
          for tok in $TOOLCHAIN; do
            case "${tok%%@*}" in
              rust)
                # A root Cargo.toml that is a [workspace] isn't the package —
                # the real manifest lives in a member dir. Skip it; the caller
                # lists the member Cargo.toml in version-files.
                if [ -f Cargo.toml ] && grep -q '^\[workspace\]' Cargo.toml; then
                  echo "root Cargo.toml is a workspace — list the member manifest in version-files"
                else
                  stamp Cargo.toml
                fi ;;
              node|bun) stamp package.json ;;
              python) stamp pyproject.toml ;;
              # go has no version file; dotnet uses .csproj → version-files
            esac
          done
          [ -n "$NODE_WORKDIR" ] && stamp "$NODE_WORKDIR/package.json"
          while IFS= read -r f; do
            f="$(echo "$f" | tr -d '\r' | xargs)"
            [ -n "$f" ] && stamp "$f" || true
          done <<< "$VERSION_FILES"
          exit 0   # a trailing `[ -n ... ]` on an empty VERSION_FILES exits 1

      # `shell:` on a step can't take an expression — the input is resolved by
      # routing: bash runs the hook inline; any other shell wraps it as
      # `<shell> -Command '<body>'`. pwsh/powershell get -NoProfile.
      - name: Setup (pre-build hook)
        if: ${{ inputs.setup-command != '' }}
        shell: bash
        env:
          HOOK: ${{ inputs.setup-command }}
          HOOK_SHELL: ${{ inputs.shell }}
        run: |
          if [ "$HOOK_SHELL" = "bash" ] || [ "$HOOK_SHELL" = "sh" ]; then
            eval "$HOOK"
          else
            "$HOOK_SHELL" -NoProfile -Command "$HOOK"
          fi

      - name: Build
        shell: bash
        env:
          HOOK: ${{ inputs.build-command }}
          HOOK_SHELL: ${{ inputs.shell }}
        run: |
          if [ "$HOOK_SHELL" = "bash" ] || [ "$HOOK_SHELL" = "sh" ]; then
            eval "$HOOK"
          else
            "$HOOK_SHELL" -NoProfile -Command "$HOOK"
          fi

      # release-please already created the Release with the changelog body —
      # attach binaries to it. Manual runs: create it if missing.
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
          ARTIFACTS: ${{ inputs.artifacts }}
          RELEASE_TITLE: ${{ inputs.release-title }}
          PRERELEASE_IN: ${{ inputs.prerelease }}
          DRAFT_IN: ${{ inputs.draft }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          is_pre=false
          [ "$PRERELEASE_IN" = "true" ] && is_pre=true
          [[ "$VER" == *-* ]] && is_pre=true
          flags=()
          $is_pre && flags+=(--prerelease)
          [ "$DRAFT_IN" = "true" ] && flags+=(--draft)

          title="${RELEASE_TITLE//\{version\}/$VER}"
          title="${title//\{tag\}/$TAG}"
          [ -z "$title" ] && title="v$VER"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "no existing release for $TAG — creating one (plain notes)"
            gh release create "$TAG" --repo "$REPO" --title "$title" --notes "Release $VER" "${flags[@]}" || { echo "::error::gh release create failed"; exit 1; }
            sleep 3   # let the API settle before upload
          else
            if $is_pre || [ "$DRAFT_IN" = "true" ]; then
              gh release edit "$TAG" --repo "$REPO" "${flags[@]}" || true
            fi
            # Apply a caller-supplied title onto an existing release too.
            [ -n "$RELEASE_TITLE" ] && gh release edit "$TAG" --repo "$REPO" --title "$title"
          fi

          # `gh release upload` glob-mangles path args on Windows — upload the
          # BASENAME from inside the file's dir, the only form it can't break.
          # Artifacts must resolve INSIDE the workspace — absolute paths or
          # `..` escapes could exfiltrate runner files onto a public Release.
          ws="$(pwd -P)"
          rc=0
          while IFS= read -r pat; do
            pat="$(echo "$pat" | tr -d '\r' | xargs)"
            [ -z "$pat" ] && continue
            matched=0
            for f in $pat; do   # intentional unquoted glob expansion
              [ -e "$f" ] || continue
              real="$(cd "$(dirname "$f")" 2>/dev/null && pwd -P)/$(basename "$f")"
              case "$real" in
                "$ws"/*) ;;   # inside workspace — ok
                *) echo "::error::artifact escapes the workspace, refused: $pat"; rc=1; continue ;;
              esac
              matched=1
              if ! (cd "$(dirname "$f")" && gh release upload "$TAG" "$(basename "$f")" --clobber --repo "$REPO"); then
                echo "::error::gh release upload failed for $f"; rc=1
              fi
            done
            [ "$matched" = 0 ] && { echo "::error::artifact not found: $pat"; rc=1; }
          done <<< "$ARTIFACTS"
          exit $rc

      - name: Append release notes
        if: ${{ inputs.release-notes != '' }}
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ inputs.release-notes }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > /tmp/body.md
          if grep -qF "$NOTES" /tmp/body.md; then
            echo "release-notes already present in body — skipping (idempotent re-run)"
          else
            printf '\n\n%s\n' "$NOTES" >> /tmp/body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body.md
            echo "appended release-notes to $TAG"
          fi

      # Contributors live in the Release body (the page), never CHANGELOG.md.
      # Range = prev_tag..this_tag; an author is "(new contributor)" if they
      # never committed before the previous tag. Reads `git log %an`.
      - name: Append Contributors section
        if: ${{ inputs.contributors }}
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          prev="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
          echo "contributor range: $range (prev: ${prev:-none})"

          mapfile -t authors < <(git log "$range" --format='%an' 2>/dev/null | sort -u | grep -v '^$')
          [ ${#authors[@]} -eq 0 ] && { echo "no authors in range"; exit 0; }

          prior=""
          [ -n "$prev" ] && prior="$(git log "$prev" --format='%an' | sort -u)"

          section=""
          for a in "${authors[@]}"; do
            badge=""
            if [ -n "$prev" ] && ! grep -qxF "$a" <<< "$prior"; then
              badge=" *(new contributor)*"
            fi
            section+="- $a$badge"$'\n'
          done

          gh release view "$TAG" --repo "$REPO" --json body --jq .body > /tmp/body.md
          if grep -q '### Contributors' /tmp/body.md; then
            echo "release body already has a Contributors section — skipping (idempotent re-run)"
          else
            printf '\n\n### Contributors\n\n%s' "$section" >> /tmp/body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/body.md
            echo "appended Contributors to $TAG"
          fi

      - name: Post-publish
        if: ${{ inputs.post-publish-command != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          HOOK: ${{ inputs.post-publish-command }}
          HOOK_SHELL: ${{ inputs.shell }}
        run: |
          if [ "$HOOK_SHELL" = "bash" ] || [ "$HOOK_SHELL" = "sh" ]; then
            eval "$HOOK"
          else
            "$HOOK_SHELL" -NoProfile -Command "$HOOK"
          fi
