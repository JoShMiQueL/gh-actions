name: Release Please (reusable)

# Opens/maintains the Release PR on every push to main — wraps release-please
# so each project only configures its own release-please-config.json +
# .release-please-manifest.json and calls this with a PAT.

on:
  workflow_call:
    secrets:
      token:
        description: PAT with repo scope — release-please's tag must re-trigger the publish workflow (a GITHUB_TOKEN-created tag wouldn't).
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.token }}
