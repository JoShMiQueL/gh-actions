name: Version

# This repo versions itself — same machinery it ships to callers.
#   push to main → release-please maintains the Release PR
#   merge it     → rp creates tag v1.x.y + Release in THIS SAME run →
#                  the floating-major step moves `v1` to it
#
# Why the major tag moves HERE and not on tag-push: release-please-action
# creates the release tag via the API with the job's GITHUB_TOKEN — that
# push does NOT re-trigger workflows (bot push, no cascade), so a
# `on.push.tags` listener never fires. Doing it in the same run, right
# after rp reports `releases_created`, is the reliable path.
#
# `contributors: false` — a tooling repo doesn't need a Contributors
# section in its own releases.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "release this version directly (skips release-please)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/release.yml
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    with:
      version: ${{ inputs.version }}
      contributors: false
      release-please: true

  # Floating major tag — production callers pin @v1, this keeps it fresh.
  # Runs on every event (after the release job) but is fully idempotent:
  # if the newest version tag is already the major's target it exits 0.
  # Prereleases never move the major.
  major-tag:
    needs: release
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move major tag to the newest release tag
        env:
          # Needs a fine-grained PAT with `workflows` permission in
          # RELEASE_PLEASE_TOKEN — GITHUB_TOKEN and OAuth gho_ tokens get
          # rejected whenever the target commit touches .github/workflows/*.
          # Falls back to a warning (not a failure) so a missing/mis-scoped
          # PAT doesn't turn the release run red.
          GH_TOKEN: ${{ secrets.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          git fetch --tags -f -q
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "${{ inputs.version }}" ]; then
            tag="v${{ inputs.version }}"
          else
            # branch push: newest version tag (rp may have just created it)
            tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          fi
          [ -z "$tag" ] && { echo "no version tag found"; exit 0; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "not a version tag: $tag"; exit 0; }
          [[ "$tag" == *-* ]] && { echo "prerelease $tag — major tag stays"; exit 0; }
          major="${tag%%.*}"
          sha="$(git rev-parse "$tag")"
          if [ "$(git rev-parse "$major" 2>/dev/null)" = "$sha" ]; then
            echo "$major already at $tag"; exit 0
          fi
          echo "moving $major → $tag"
          if gh api "repos/$REPO/git/refs/tags/$major" --method PATCH -f sha="$sha" -F force=true 2>/dev/null \
             || gh api "repos/$REPO/git/refs" --method POST -f ref="refs/tags/$major" -f sha="$sha" 2>/dev/null; then
            echo "moved $major → $tag"
          else
            echo "::warning::couldn't move $major — RELEASE_PLEASE_TOKEN needs 'workflows' permission (fine-grained PAT) when the commit touches .github/workflows"
          fi
