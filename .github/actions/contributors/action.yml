name: contributors
description: >-
  Append a "### Contributors" section to a GitHub Release BODY listing the
  git-commit authors of the release range, tagging first-time committers with
  "(new contributor)". Edits the release page only — the CHANGELOG.md file in
  the repo stays clean (changes-only, the clap model). Reads `git log %an`
  authors because direct commits carry no GitHub-PR contributor data.
author: JoShMiQueL

inputs:
  tag:
    description: 'Release tag, e.g. "v0.1.4"'
    required: true
  repo:
    description: 'owner/repo (defaults to the running repo)'
    required: false
    default: ''
  github-token:
    description: 'Token with contents:write on the release'
    required: true

runs:
  using: composite
  steps:
    - name: Append Contributors section to Release body
      shell: pwsh
      env:
        TAG: ${{ inputs.tag }}
        REPO: ${{ inputs.repo || github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # Need full history to know who committed before this range — a
        # shallow clone would mark everyone as "new".
        git fetch --prune --unshallow --tags *> $null
        if ($LASTEXITCODE -ne 0) { git fetch --tags --depth=200 *> $null }

        $tag = $env:TAG
        $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
        $range = if ($prev) { "$prev..$tag" } else { $tag }
        Write-Output "contributor range: $range (prev tag: $($prev -or 'none'))"

        $rangeAuthors = git log $range --format='%an' 2>$null | Where-Object { $_ } | Sort-Object -Unique
        if (-not $rangeAuthors) { Write-Output "no authors in range"; exit 0 }

        $priorAuthors = @()
        if ($prev) { $priorAuthors = git log "$prev" --format='%an' 2>$null | Sort-Object -Unique }

        $section = "`n`n### Contributors`n`n"
        foreach ($a in $rangeAuthors) {
          $isNew = $prev -and ($priorAuthors -notcontains $a)
          $badge = if ($isNew) { " *(new contributor)*" } else { "" }
          $section += "- $a$badge`n"
        }
        $section = $section.TrimEnd()

        # Merge with the existing body (release-please changelog) — don't replace.
        $bodyFile = New-TemporaryFile
        gh release view $tag --repo $env:REPO --json body --jq .body | Out-File $bodyFile -Encoding utf8
        Add-Content $bodyFile "`n$section`n"
        gh release edit $tag --repo $env:REPO --notes-file $bodyFile
        Remove-Item $bodyFile -ErrorAction SilentlyContinue
        Write-Output "appended Contributors to $tag"
